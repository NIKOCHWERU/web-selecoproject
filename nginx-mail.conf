# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR MAIL.SELECOPROJECT.COM
# Full SSL Hardening, Security Headers, and 50MB Attachment Support
# ==============================================================================

# 1. HTTP Redirect to HTTPS & Let's Encrypt ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name mail.selecoproject.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Reverse Proxy to Roundcube Webmail
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.selecoproject.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mail.selecoproject.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.selecoproject.com/privkey.pem;

    # Modern SSL Protocol & Ciphers (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Email Attachment Maximum Upload Size
    client_max_body_size 50M;

    # Reverse Proxy to Roundcube Container (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts for large email drafting and attachments
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
